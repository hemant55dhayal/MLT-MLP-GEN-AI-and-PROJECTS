  --border: #252a36;
  --border-hover: #353c4e;
  --text: #e6e8ee;

  --orange: #fb923c;

body {

  min-height: 100vh;
}

/* ─── HEADER ─── */
.header {

  top: 0;
  z-index: 100;
  background: rgba(8,9,12,0.85);

  border-bottom: 1px solid var(--border);
  padding: 0 24px;
}

.header-inner {

  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 60px;
}

.logo {

  align-items: center;
  gap: 10px;
  font-family: 'Bricolage Grotesque', sans-serif;
  font-weight: 800;
  font-size: 18px;
  letter-spacing: -0.5px;
  text-decoration: none;
  color: var(--text);
}

.logo-icon {

  height: 32px;
  background: linear-gradient(135deg, var(--blue), var(--purple));
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
}

.header-badge {

  border-radius: 6px;
  background: var(--green-dim);
  color: var(--green);
  letter-spacing: 0.5px;
}

/* ─── NAV TABS ─── */
.nav {
  display: flex;
  gap: 2px;
  padding: 0 24px;
  max-width: 1000px;
  margin: 0 auto;
  border-bottom: 1px solid var(--border);
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}

.nav::-webkit-scrollbar { display: none; }

.nav-tab {
  padding: 14px 18px;
  font-size: 14px;
  font-weight: 500;
  color: var(--text-muted);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  white-space: nowrap;
  transition: color 0.2s, border-color 0.2s;
  user-select: none;
}

.nav-tab:hover { color: var(--text); }
.nav-tab.active { color: var(--text); border-bottom-color: var(--blue); font-weight: 600; }

.nav-tab .tab-emoji { margin-right: 6px; }

/* ─── COURSE FILTER ─── */
.filter-bar {
  max-width: 1000px;
  margin: 0 auto;
  padding: 16px 24px;
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.filter-chip {
  padding: 6px 14px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text-muted);
  transition: all 0.2s;
  user-select: none;
}

.filter-chip:hover { border-color: var(--border-hover); color: var(--text); }
.filter-chip.active { background: var(--blue-dim); border-color: rgba(96,165,250,0.3); color: var(--blue); }
.filter-chip[data-course="mlt"].active { background: var(--blue-dim); border-color: rgba(96,165,250,0.3); color: var(--blue); }
.filter-chip[data-course="mlp"].active { background: var(--orange-dim); border-color: rgba(251,146,60,0.3); color: var(--orange); }
.filter-chip[data-course="dlgenai"].active { background: var(--purple-dim); border-color: rgba(192,132,252,0.3); color: var(--purple); }
.filter-chip[data-course="general"].active { background: var(--teal-dim); border-color: rgba(45,212,191,0.3); color: var(--teal); }

/* ─── MAIN CONTENT ─── */
.main {
  max-width: 1000px;
  margin: 0 auto;
  padding: 0 24px 80px;
}

.tab-content { display: none; }
.tab-content.active { display: block; }

/* ─── ANNOUNCEMENTS ─── */
.announcement {
  background: var(--surface);

  border-radius: 14px;
  padding: 22px 24px;
  margin-top: 14px;
  transition: border-color 0.2s;
  position: relative;
}

.announcement:hover { border-color: var(--border-hover); }

.announcement.pinned {
  border-color: rgba(251,191,36,0.3);
  background: linear-gradient(135deg, var(--surface), rgba(251,191,36,0.03));
}

.announcement.pinned::before {
  content: '📌 Pinned';
  position: absolute;
  top: 12px;
  right: 16px;
  font-size: 11px;
  font-weight: 700;
  color: var(--yellow);
  text-transform: uppercase;
  letter-spacing: 1px;
}

.ann-meta {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 8px;
  flex-wrap: wrap;
}

.ann-course {

  font-weight: 700;
  padding: 2px 8px;
  border-radius: 5px;
  text-transform: uppercase;
  letter-spacing: 0.8px;

.ann-course.mlt { background: var(--blue-dim); color: var(--blue); }
.ann-course.mlp { background: var(--orange-dim); color: var(--orange); }
.ann-course.dlgenai { background: var(--purple-dim); color: var(--purple); }
.ann-course.general { background: var(--teal-dim); color: var(--teal); }

.ann-date { font-size: 12px; color: var(--text-dim); font-family: 'Fira Code', monospace; }

.announcement h3 { font-size: 16px; font-weight: 700; margin-bottom: 6px; }
.announcement p { font-size: 14px; color: var(--text-muted); line-height: 1.7; }
.announcement a { color: var(--blue); text-decoration: none; }

/* ─── SCHEDULE ─── */

  font-weight: 700;

  .sch-date-box { width: auto; display: flex; gap: 8px; align-items: center; padding: 6px 12px; }
  .sch-status { align-self: flex-start; }
}

      date: "2026-05-26",
      title: "Scikit-Learn Pipeline Cheat Sheet",
      body: `<strong>Why Pipeline?</strong> Keeps preprocessing reproducible. Prevents data leakage.

<code>Pipeline([('scaler', StandardScaler()), ('model', Ridge())])</code>

<strong>With ColumnTransformer:</strong>
<code>ColumnTransformer([('num', StandardScaler(), num_cols), ('cat', OneHotEncoder(), cat_cols)])</code>

<strong>With GridSearchCV:</strong>
<code>GridSearchCV(pipe, {'model__alpha': [0.1, 1, 10]}, cv=5)</code>

<strong>Rule:</strong> Always fit on train, transform on both train & test. Pipeline handles this automatically.`
    },
    {
      course: "dlgenai",
      date: "2026-05-26",
      title: "PyTorch Training Loop Template",
      body: `<strong>The pattern you'll use 100 times:</strong>

<code>for epoch in range(num_epochs):</code>
<code>    for batch_x, batch_y in dataloader:</code>
<code>        pred = model(batch_x)        # forward</code>
<code>        loss = criterion(pred, batch_y) # loss</code>
<code>        optimizer.zero_grad()          # clear grads</code>
<code>        loss.backward()                # backward</code>
<code>        optimizer.step()               # update</code>

<strong>Remember:</strong> zero_grad → forward → loss → backward → step. This order matters.`
    },
  ],
};

// ╔══════════════════════════════════════════════════════════════╗
// ║  ⚡ APP LOGIC — You don't need to edit below this line     ║
// ╚══════════════════════════════════════════════════════════════╝

let activeTab = 'announcements';
let activeFilter = 'all';

// Tabs
document.querySelectorAll('.nav-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    activeTab = tab.dataset.tab;
    document.querySelectorAll('.tab-content').forEach(tc => tc.classList.remove('active'));
    document.getElementById('tab-' + activeTab).classList.add('active');
  });
});

// Filters
document.querySelectorAll('.filter-chip').forEach(chip => {
  chip.addEventListener('click', () => {
    document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    activeFilter = chip.dataset.course;
    renderAll();
  });
});

function filterByCourse(items) {
  if (activeFilter === 'all') return items;
  return items.filter(i => i.course === activeFilter);
}

function courseTag(course) {
  const labels = { mlt: 'MLT', mlp: 'MLP', dlgenai: 'DL & GenAI', general: 'General' };
  return `<span class="ann-course ${course}">${labels[course] || course}</span>`;
}

function formatDate(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  return d.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
}

function emptyState(icon, title, desc) {
  return `<div class="empty-state"><div class="es-icon">${icon}</div><h3>${title}</h3><p>${desc}</p></div>`;
}

// Render announcements
function renderAnnouncements() {
  const container = document.getElementById('tab-announcements');
  const items = filterByCourse(DATA.announcements);
  if (!items.length) { container.innerHTML = emptyState('📢', 'No announcements', 'Nothing here for this filter yet.'); return; }

  const sorted = [...items].sort((a, b) => {
    if (a.pinned && !b.pinned) return -1;
    if (!a.pinned && b.pinned) return 1;
    return new Date(b.date) - new Date(a.date);
  });

  container.innerHTML = sorted.map(a => `
    <div class="announcement ${a.pinned ? 'pinned' : ''}" data-course="${a.course}">
      <div class="ann-meta">
        ${courseTag(a.course)}
        <span class="ann-date">${formatDate(a.date)}</span>
      </div>
      <h3>${a.title}</h3>
      <p>${a.body}</p>
    </div>
  `).join('');
}

// Render schedule
function renderSchedule() {
  const container = document.getElementById('tab-schedule');
  const items = filterByCourse(DATA.schedule);
  if (!items.length) { container.innerHTML = emptyState('📅', 'No sessions scheduled', 'Nothing here for this filter yet.'); return; }

  const sorted = [...items].sort((a, b) => new Date(a.date) - new Date(b.date));

  container.innerHTML = sorted.map(s => `
    <div class="schedule-item" data-course="${s.course}">
      <div class="sch-date-box">
        <div class="month">${s.month}</div>
        <div class="day">${s.day}</div>
      </div>
      <div class="sch-info">
        <div class="ann-meta" style="margin-bottom:4px;">${courseTag(s.course)}</div>
        <h3>${s.title}</h3>
        <div class="sch-time">${s.time}</div>
        <p>${s.description}</p>
        ${s.link ? `<a href="${s.link}" target="_blank" style="color:var(--blue);font-size:13px;font-weight:600;margin-top:6px;display:inline-block;">Join Meeting →</a>` : ''}
      </div>
      <span class="sch-status ${s.status}">${s.status}</span>
    </div>
  `).join('');
}

// Render resources
function renderResources() {
  const container = document.getElementById('tab-resources');
  const items = filterByCourse(DATA.resources);
  if (!items.length) { container.innerHTML = emptyState('📚', 'No resources', 'Nothing here for this filter yet.'); return; }

  container.innerHTML = `<div class="resource-grid">${items.map(r => `
    <div class="resource-card" data-course="${r.course}">
      <span class="rc-type ${r.type}">${r.type}</span>
      <div class="ann-meta" style="margin-bottom:6px;">${courseTag(r.course)}</div>
      <h3>${r.title}</h3>
      <p>${r.description}</p>
      ${r.link && r.link !== '#' ? `<a class="rc-link" href="${r.link}" target="_blank">Open →</a>` : `<span style="font-size:12px;color:var(--text-dim);">Link coming soon</span>`}
    </div>
  `).join('')}</div>`;
}

// Render notes
function renderNotes() {
  const container = document.getElementById('tab-notes');
  const items = filterByCourse(DATA.notes);
  if (!items.length) { container.innerHTML = emptyState('📝', 'No notes', 'Nothing here for this filter yet.'); return; }

  container.innerHTML = items.map(n => `
    <div class="note-card" data-course="${n.course}">
      <div class="note-head">
        ${courseTag(n.course)}
        <span class="ann-date">${formatDate(n.date)}</span>
      </div>
      <h3>${n.title}</h3>
      <div class="note-body">${n.body}</div>
    </div>
  `).join('');
}

function renderAll() {
  renderAnnouncements();
  renderSchedule();
  renderResources();
  renderNotes();
}

// Initial render
renderAll();
</script>
</body>
</html>
